<!DOCTYPE html>
<html lang="en">
  <head>

    <title>FlyttGo Global Logistics &amp; Relocation Marketplace</title>
    <meta name="description" content="FlyttGo Global Logistics & Relocation Marketplace — worldwide digital coordination infrastructure connecting customers with licensed relocation providers, logistics partners, workforce support, storage, and mobility services across multiple jurisdictions." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"

    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Leaflet (delivery tracking maps) -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlyttGo Global Logistics &amp; Relocation Marketplace" />

    <meta property="og:url" content="https://flyttgo.us/" />
    <meta property="og:title" content="FlyttGo Global Logistics &amp; Relocation Marketplace" />

    <meta name="twitter:title" content="FlyttGo Global Logistics &amp; Relocation Marketplace" />
    <meta name="twitter:description" content="Worldwide digital coordination marketplace — United States, Canada, Germany, France, United Kingdom, Norway." />

    <meta name="twitter:image:alt" content="FlyttGo Global Logistics & Relocation Marketplace" />

    <!-- JSON-LD: Organization (global marketplace platform operator) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://flyttgo.us/#organization",
      "name": "FlyttGo Global Logistics & Relocation Marketplace",
      "alternateName": "FlyttGo Global",
      "description": "Worldwide digital coordination marketplace connecting customers with independent licensed relocation providers across multiple jurisdictions.",
      "url": "https://flyttgo.us/",
      "logo": "https://flyttgo.us/apple-touch-icon.svg",
      "image": "https://flyttgo.us/og.svg",
      "areaServed": [
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "Canada" },
        { "@type": "Country", "name": "Germany" },
        { "@type": "Country", "name": "France" },
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "Norway" }
      ],
      "subOrganization": [
        {
          "@type": "Organization",
          "name": "Wankong LLC",
          "description": "Operates United States and Canadian marketplace surfaces.",
          "address": { "@type": "PostalAddress", "addressLocality": "Wilmington", "addressRegion": "DE", "addressCountry": "US" }
        },
        {
          "@type": "Organization",
          "name": "FlyttGo Technologies Group",
          "description": "Operates Norway, United Kingdom, Germany, and France marketplace surfaces.",
          "address": { "@type": "PostalAddress", "addressCountry": "NO" }
        }
      ],
      "knowsAbout": [
        "Global relocation coordination",
        "Licensed motor carrier matching",
        "Moving labor marketplace",
        "Cross-border relocation",
        "International relocation coordination",
        "Storage partner integration",
        "Truck rental coordination",
        "Packing services coordination",
        "Corporate relocation workflows",
        "University relocation",
        "FMCSA / GVOL / GüKG / registre des transporteurs / yrkestransportløyve awareness"
      ]
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://flyttgo.us/#website",
      "url": "https://flyttgo.us/",
      "name": "FlyttGo Global Logistics & Relocation Marketplace",
      "publisher": { "@id": "https://flyttgo.us/#organization" },
      "inLanguage": ["en-US","en-GB","de-DE","fr-FR","nb-NO"]
    }
    </script>

    <!-- JSON-LD: Service catalog -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Global relocation coordination marketplace",
      "provider": { "@id": "https://flyttgo.us/#organization" },
      "areaServed": [
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "Canada" },
        { "@type": "Country", "name": "Germany" },
        { "@type": "Country", "name": "France" },
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "Norway" }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "FlyttGo global marketplace categories",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Licensed moving carrier matching" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Moving labor marketplace coordination" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Packing services coordination" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Storage partner integration" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Truck rental partner coordination" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Insurance selection compatibility layer" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Corporate relocation workflows" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Student relocation workflows" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Municipal relocation coordination support" } }
        ]
      }
    }
    </script>

    <!-- Editorial design system tokens.
         Headlines = IBM Plex Serif. Body = Inter. Code labels = JetBrains Mono.
         80px vertical rhythm is applied per-section via py-20 in components. -->
    <style>
      :root {
        --font-serif: 'IBM Plex Serif', ui-serif, Georgia, serif;
        --font-sans:  'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      html { scroll-behavior: smooth; scroll-padding-top: 120px; font-family: var(--font-sans); }
      body { font-family: var(--font-sans); }
      .font-serif { font-family: var(--font-serif) !important; }
      .font-mono  { font-family: var(--font-mono)  !important; }
    </style>

    <div id="root"></div>
