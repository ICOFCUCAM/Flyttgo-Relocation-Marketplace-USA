<!--
  FlyttGo Apple touch icon — 180×180 home-screen tile.
  Larger size means we can include the F-mark + the wordmark
  underneath, mirroring the inverse variant of <FlyttGoLogo />.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Brand tile — deep navy with subtle radial highlight in the
       upper right so the icon reads as dimensional on iOS' flat
       home-screen grid. -->
  <defs>
    <radialGradient id="ftg-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="#0b1f3a"/>
  <rect width="180" height="180" rx="40" fill="url(#ftg-glow)"/>

  <!-- F-mark — scaled and centred above the wordmark. -->
  <g transform="translate(58 28) scale(1.05)">
    <path
      d="M 22 12 L 54 12 L 54 22 L 33 22 L 33 30 L 47 30 L 47 40 L 33 40 L 33 54 L 25 54 L 22 36 Z"
      fill="#ffffff"
    />
    <path
      d="M 14 54 C 14 44, 20 36, 28 34 C 26 42, 22 52, 14 54 Z"
      fill="#fbbf24"
    />
  </g>

  <!-- Wordmark — bold italic, "Flytt" white, "Go" amber. text-anchor
       middle keeps the lockup centred regardless of the renderer's
       glyph metrics. -->
  <text
    x="90" y="146"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
    font-style="italic"
    font-weight="900"
    font-size="28"
    letter-spacing="-1"
  >
    <tspan fill="#ffffff">Flytt</tspan><tspan fill="#fbbf24">Go</tspan>
  </text>
</svg>
