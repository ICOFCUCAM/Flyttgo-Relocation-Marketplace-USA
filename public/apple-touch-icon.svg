<!--
  FlyttGo Apple touch icon — 180×180 home-screen tile.
  Geometry mirrors src/components/brand/FlyttGoLogo.tsx (color
  variant on a deep-navy tile) so the home-screen icon reads
  identically to the in-app brand component.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="ftg-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="#0b1f3a"/>
  <rect width="180" height="180" rx="40" fill="url(#ftg-glow)"/>

  <!-- F-mark — same geometry as the favicon, scaled up and centred
       above the wordmark. -->
  <g transform="translate(50 22) scale(1.35)">
    <g transform="skewX(-14) translate(14 4)">
      <path
        d="M 18 6 L 54 6 L 54 18 L 30 18 L 30 28 L 44 28 L 44 38 L 30 38 L 30 58 L 18 58 Z"
        fill="#ffffff"
      />
    </g>
    <path
      d="M 6 58 C 6 44, 16 32, 28 30 C 30 36, 28 46, 22 53 C 18 57, 12 60, 6 58 Z"
      fill="#fbbf24"
    />
  </g>

  <!-- "FlyttGo" wordmark — bold italic, two-tone. -->
  <text
    x="90" y="158"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
    font-style="italic"
    font-weight="900"
    font-size="30"
    letter-spacing="-1.5"
  >
    <tspan fill="#ffffff">Flytt</tspan><tspan fill="#fbbf24">Go</tspan>
  </text>
</svg>
