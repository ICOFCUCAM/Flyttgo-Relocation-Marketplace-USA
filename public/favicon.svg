<!--
  FlyttGo favicon — F-mark only (no wordmark for legibility at 16×16).
  Geometry mirrors src/components/brand/FlyttGoLogo.tsx so the favicon,
  apple-touch-icon, and in-app brand component all read as one mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b1f3a"/>

  <!-- Italic block F via uniform skewX. -->
  <g transform="skewX(-14) translate(14 4)">
    <path
      d="M 18 6 L 54 6 L 54 18 L 30 18 L 30 28 L 44 28 L 44 38 L 30 38 L 30 58 L 18 58 Z"
      fill="#ffffff"
    />
  </g>

  <!-- Leaf / flame accent — amber teardrop, lower-left. -->
  <path
    d="M 6 58 C 6 44, 16 32, 28 30 C 30 36, 28 46, 22 53 C 18 57, 12 60, 6 58 Z"
    fill="#fbbf24"
  />
</svg>
